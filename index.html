<script>
    // -------------------------------------------------------------
    // PASTE YOUR LATEST GOOGLE APPS SCRIPT URL HERE
    // -------------------------------------------------------------
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyge7tXddDFerC0xUUVBnpxe5nWg6MJBFEkLrU8nn_dHxkVcJoAnvZql1bhxtHTvz9DDw/exec";

    let appState = { 
      currentUser: "", employeeId: "", email: "", password: "", userRole: "Employee", currentRole: "employee",
      currentTripId: null, activeCategory: "Travel", 
      trips: [], expenses: [],
      personalTrips: [], personalExpenses: [] // Used to restore view after leaving Admin mode
    };
    let sessionTimeoutTracker; let authMode = "login"; 

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("fieldDate").value = new Date().toISOString().split("T")[0];
      checkSession();
    });

    // --- AUTHENTICATION & ROLE MGMT ---
    function toggleAuthMode() {
      authMode = authMode === "login" ? "register" : "login";
      document.getElementById("nameFieldGroup").classList.toggle("hidden", authMode === "login");
      document.getElementById("emailFieldGroup").classList.toggle("hidden", authMode === "login");
      document.getElementById("authName").required = authMode === "register";
      document.getElementById("authEmail").required = authMode === "register";
      document.getElementById("authIdLabel").innerHTML = authMode === "login" ? 'Employee ID or Email <span class="text-red-500">*</span>' : 'Employee ID <span class="text-red-500">*</span>';
      document.getElementById("authTitle").innerText = authMode === "login" ? "Company Portal" : "Create Account";
      document.getElementById("authSubtitle").innerText = authMode === "login" ? "Sign in to manage your expenses" : "Register as a new employee";
      document.getElementById("authSubmitBtn").innerHTML = authMode === "login" ? 'Secure Login <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>' : 'Register Account <i class="fa-solid fa-user-plus ml-2"></i>';
      document.getElementById("authToggleBtn").innerText = authMode === "login" ? "New employee? Create an account" : "Already have an account? Sign In";
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("authSubmitBtn"); const originalHtml = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...'; btn.disabled = true;

      const payload = { action: authMode, name: document.getElementById("authName").value.trim(), empId: document.getElementById("authId").value.trim(), email: document.getElementById("authEmail").value.trim(), password: document.getElementById("authPassword").value.trim() };
      if (authMode === "login") payload.loginId = document.getElementById("authId").value.trim();

      try {
        const response = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
        const result = await response.json();
        
        if (result.status === "success") {
          if (authMode === "register") {
            alert("Account created! Please log in.");
            toggleAuthMode();
            document.getElementById("authId").value = payload.empId; document.getElementById("authPassword").value = "";
          } else {
            appState.currentUser = result.user.name; appState.employeeId = result.user.empId; appState.email = result.user.email; appState.password = result.user.password;
            appState.userRole = result.user.role || "Employee";
            
            // RBAC: Show Admin toggle only if user is an Admin
            if(appState.userRole === "Admin") {
              document.getElementById("adminControlsContainer").classList.remove("hidden");
              document.getElementById("adminControlsContainer").classList.add("flex");
            } else {
              document.getElementById("adminControlsContainer").classList.add("hidden");
              document.getElementById("adminControlsContainer").classList.remove("flex");
            }

            appState.personalTrips = result.trips && result.trips.length > 0 ? result.trips : [];
            appState.personalExpenses = result.expenses && result.expenses.length > 0 ? result.expenses : [];
            appState.trips = [...appState.personalTrips];
            appState.expenses = [...appState.personalExpenses];
            appState.currentTripId = appState.trips.length > 0 ? appState.trips[0].id : null;
            
            localStorage.setItem("expense_session_expiry", Date.now() + (60 * 60 * 1000));
            saveStorageData(); showMainApp(); document.getElementById("authForm").reset();
          }
        } else alert(result.message);
      } catch (err) { alert("Network Error: Ensure your Google Script URL is pasted correctly."); }
      finally { btn.innerHTML = originalHtml; btn.disabled = false; }
    }

    async function switchRole(role) {
      appState.currentRole = role;
      const empBtn = document.getElementById("roleEmployeeBtn"); const admBtn = document.getElementById("roleAdminBtn");
      
      if (role === "admin") {
        admBtn.className = "px-3 py-1 rounded bg-amber-600 text-white font-medium transition";
        empBtn.className = "px-3 py-1 rounded text-slate-300 hover:text-white font-medium transition";
        await fetchAllCompanyData();
      } else {
        empBtn.className = "px-3 py-1 rounded bg-red-600 text-white font-medium transition";
        admBtn.className = "px-3 py-1 rounded text-slate-300 hover:text-white font-medium transition";
        appState.trips = [...appState.personalTrips]; appState.expenses = [...appState.personalExpenses];
        appState.currentTripId = appState.trips.length > 0 ? appState.trips[0].id : null;
        renderTripDropdown(); recalcStatsAndRender();
      }
    }

    async function fetchAllCompanyData() {
      document.getElementById("tripSelect").innerHTML = '<option>Loading company data...</option>';
      try {
        const payload = { action: "fetchAdminData" };
        const r = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
        const res = await r.json();
        if(res.status === "success") {
          appState.trips = res.trips || []; appState.expenses = res.expenses || [];
          appState.currentTripId = appState.trips.length > 0 ? appState.trips[0].id : null;
          renderTripDropdown(); recalcStatsAndRender();
        }
      } catch (e) { alert("Failed to fetch admin data"); renderTripDropdown(); }
    }

    // --- SESSION & PROFILE ---
    function checkSession() { const exp = localStorage.getItem("expense_session_expiry"); if (exp && Date.now() < parseInt(exp)) { loadStorageData(); showMainApp(); resetSessionTimer(); } else logout(false); }
    function resetSessionTimer() { clearTimeout(sessionTimeoutTracker); localStorage.setItem("expense_session_expiry", Date.now() + (60 * 60 * 1000)); sessionTimeoutTracker = setTimeout(() => logout(false), 60 * 60 * 1000); }
    document.addEventListener("mousemove", () => { if(!document.getElementById("mainApp").classList.contains("hidden")) resetSessionTimer(); });
    function logout(manual = true) { localStorage.removeItem("expense_session_expiry"); document.getElementById("mainApp").classList.add("hidden"); document.getElementById("mainApp").classList.remove("flex"); document.getElementById("authScreen").classList.remove("hidden"); }

    function showMainApp() {
      document.getElementById("authScreen").classList.add("hidden"); document.getElementById("mainApp").classList.remove("hidden"); document.getElementById("mainApp").classList.add("flex");
      document.getElementById("navEmployeeName").innerText = appState.currentUser;
      if(appState.trips.length === 0 && appState.currentRole !== 'admin') { appState.trips.push({ id: "trip_1", employeeName: appState.currentUser, projectName: "Default Trip", startDate: "2026-01-01", endDate: "2026-01-01", advance: 0 }); appState.currentTripId = "trip_1"; saveStorageData(); }
      if(appState.userRole === "Admin") { document.getElementById("adminControlsContainer").classList.remove("hidden"); document.getElementById("adminControlsContainer").classList.add("flex"); }
      renderTripDropdown(); recalcStatsAndRender();
    }

    function openProfileModal() { document.getElementById("modalProfileName").value = appState.currentUser; document.getElementById("modalProfileId").value = appState.employeeId; document.getElementById("modalProfileEmail").value = appState.email; document.getElementById("modalProfilePassword").value = appState.password; document.getElementById("profileModal").classList.remove("hidden"); }
    function closeProfileModal() { document.getElementById("profileModal").classList.add("hidden"); }
    async function handleProfileSubmit(e) {
      e.preventDefault(); const btn = document.getElementById("btnUpdateProfile"); btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...'; btn.disabled = true;
      const payload = { action: "updateProfile", oldEmpId: appState.employeeId, name: document.getElementById("modalProfileName").value.trim(), empId: document.getElementById("modalProfileId").value.trim(), email: document.getElementById("modalProfileEmail").value.trim(), password: document.getElementById("modalProfilePassword").value.trim() };
      try {
        const r = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) }); const res = await r.json();
        if (res.status === "success") { appState.currentUser = payload.name; appState.employeeId = payload.empId; appState.email = payload.email; appState.password = payload.password; document.getElementById("navEmployeeName").innerText = payload.name; saveStorageData(); closeProfileModal(); alert("Profile updated!"); }
      } catch (err) { alert("Network Error"); } finally { btn.innerHTML = "Save"; btn.disabled = false; }
    }

    function loadStorageData() {
      appState.currentUser = localStorage.getItem("expense_current_user"); appState.employeeId = localStorage.getItem("expense_employee_id"); appState.email = localStorage.getItem("expense_email"); appState.password = localStorage.getItem("expense_password"); appState.userRole = localStorage.getItem("expense_user_role") || "Employee";
      try { appState.personalTrips = JSON.parse(localStorage.getItem("expense_trips")) || []; } catch(e){}
      try { appState.personalExpenses = JSON.parse(localStorage.getItem("expense_records")) || []; } catch(e){}
      appState.trips = [...appState.personalTrips]; appState.expenses = [...appState.personalExpenses];
      appState.currentTripId = localStorage.getItem("expense_active_trip_id") || (appState.trips.length > 0 ? appState.trips[0].id : null);
    }
    function saveStorageData() {
      if(appState.currentRole === "employee") { appState.personalTrips = [...appState.trips]; appState.personalExpenses = [...appState.expenses]; }
      localStorage.setItem("expense_current_user", appState.currentUser); localStorage.setItem("expense_employee_id", appState.employeeId); localStorage.setItem("expense_email", appState.email); localStorage.setItem("expense_password", appState.password); localStorage.setItem("expense_user_role", appState.userRole);
      localStorage.setItem("expense_trips", JSON.stringify(appState.personalTrips)); localStorage.setItem("expense_records", JSON.stringify(appState.personalExpenses));
      if (appState.currentTripId) localStorage.setItem("expense_active_trip_id", appState.currentTripId);
    }

    // --- TRIPS ---
    function renderTripDropdown() {
      const sel = document.getElementById("tripSelect"); sel.innerHTML = "";
      if(appState.trips.length === 0) { sel.innerHTML = `<option value="">-- No Trips --</option>`; document.getElementById("tripDurationDisplay").innerText = "--"; document.getElementById("statAdvanceInput").value = 0; return; }
      
      appState.trips.forEach(t => { 
        const opt = document.createElement("option"); opt.value = t.id; 
        opt.textContent = appState.currentRole === "admin" ? `${t.employeeName} - ${t.projectName}` : t.projectName;
        if(t.id === appState.currentTripId) opt.selected=true; 
        sel.appendChild(opt); 
      });
      const trip = appState.trips.find(t=>t.id===appState.currentTripId);
      if(trip) { document.getElementById("tripDurationDisplay").innerText = `${trip.startDate} to ${trip.endDate}`; document.getElementById("statAdvanceInput").value = trip.advance || 0; }
    }
    function updateTripAdvance(val) { const trip = appState.trips.find(t => t.id === appState.currentTripId); if (trip) { trip.advance = parseFloat(val) || 0; saveStorageData(); recalcStatsAndRender(); } }
    function onTripChange() { appState.currentTripId = document.getElementById("tripSelect").value; saveStorageData(); renderTripDropdown(); recalcStatsAndRender(); }
    
    function openTripModal(edit) {
      if(edit && appState.currentTripId) { const t = appState.trips.find(x=>x.id===appState.currentTripId); document.getElementById("modalProjectName").value = t.projectName; document.getElementById("modalStartDate").value = t.startDate; document.getElementById("modalEndDate").value = t.endDate; document.getElementById("modalAdvance").value = t.advance || 0; document.getElementById("modalTripTitle").innerText = "Edit Trip Details"; } 
      else { document.getElementById("modalProjectName").value = ""; document.getElementById("modalAdvance").value = ""; document.getElementById("modalStartDate").value = new Date().toISOString().split("T")[0]; document.getElementById("modalEndDate").value = new Date().toISOString().split("T")[0]; document.getElementById("modalTripTitle").innerText = "Create New Trip"; }
      document.getElementById("tripModal").classList.remove("hidden"); 
    }
    function closeTripModal() { document.getElementById("tripModal").classList.add("hidden"); }
    
    function handleTripModalSubmit(e) {
      e.preventDefault();
      const proj = document.getElementById("modalProjectName").value.trim(), sd = document.getElementById("modalStartDate").value, ed = document.getElementById("modalEndDate").value, adv = parseFloat(document.getElementById("modalAdvance").value) || 0;
      let tripObj = null, oldName = null; const existing = appState.trips.find(t => t.id === appState.currentTripId);
      if (existing && document.getElementById("modalTripTitle").innerText.includes("Edit")) {
        oldName = existing.projectName; existing.projectName = proj; existing.startDate = sd; existing.endDate = ed; existing.advance = adv; tripObj = existing;
        if(oldName !== proj) appState.expenses.forEach(exp => { if(exp.project === oldName) exp.project = proj; });
      } else {
        tripObj = { id: "trip_"+Date.now(), employeeName: appState.currentUser, projectName: proj, startDate: sd, endDate: ed, advance: adv }; appState.trips.push(tripObj); appState.currentTripId = tripObj.id;
      }
      saveStorageData(); closeTripModal(); renderTripDropdown(); recalcStatsAndRender();
      fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "saveTrip", trip: tripObj, oldProjectName: oldName }) });
    }

    async function deleteCurrentTrip() {
      if (!appState.currentTripId) return; const trip = appState.trips.find(t => t.id === appState.currentTripId);
      if (!confirm(`Permanently delete the entire trip "${trip.projectName}" and ALL its expenses?`)) return;
      const payload = { action: "deleteTrip", employeeName: trip.employeeName, project: trip.projectName };
      appState.trips = appState.trips.filter(t => t.id !== appState.currentTripId); appState.expenses = appState.expenses.filter(e => e.project !== trip.projectName); appState.currentTripId = appState.trips.length > 0 ? appState.trips[0].id : null;
      saveStorageData(); renderTripDropdown(); recalcStatsAndRender();
      fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    }

    // --- ADMIN EXPENSE APPROVAL ---
    async function updateExpenseStatus(expId, newStatus) {
      const exp = appState.expenses.find(e => e.id === expId);
      if (!exp) return;
      const payload = { action: "updateStatus", employeeName: exp.employeeName, project: exp.project, date: exp.date, amount: exp.amount, status: newStatus };
      exp.status = newStatus;
      saveStorageData(); recalcStatsAndRender();
      fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) }).catch(e => console.error("Failed to update status"));
    }

    // --- EXPENSES ---
    function setExpenseType(t) { appState.activeCategory = t; ["Travel","Food","Rent","Others"].forEach(x => { document.getElementById(`fields${x}`).classList.toggle("hidden", x!==t); document.getElementById(`tab-${x}`).className = x===t ? "py-2 rounded-md transition shadow-sm bg-white text-red-600 font-bold" : "py-2 rounded-md transition text-slate-600 hover:text-slate-900"; }); }
    function handleFoodReasonChange(val) { const d = document.getElementById("foodCustomReasonDiv"); if (val === "Custom") { d.classList.remove("hidden"); document.getElementById("foodCustomReason").required = true; } else { d.classList.add("hidden"); document.getElementById("foodCustomReason").required = false; } }

    let currentCompressedBill = null, currentCompressedPay = null;
    function compressImageToJpeg(file) { return new Promise(resolve => { const r = new FileReader(); r.readAsDataURL(file); r.onload = e => { const i = new Image(); i.src = e.target.result; i.onload = () => { const c = document.createElement("canvas"); let w=i.width, h=i.height; if(w>1280||h>1280){if(w>h){h=Math.round((h*1280)/w);w=1280;}else{w=Math.round((w*1280)/h);h=1280;}} c.width=w; c.height=h; c.getContext("2d").drawImage(i,0,0,w,h); resolve(c.toDataURL("image/jpeg",0.72)); }; }; }); }
    async function previewImageFile(input, type) { if(input.files && input.files[0]) { const b64 = await compressImageToJpeg(input.files[0]); if(type==='fileBill') currentCompressedBill = b64; else currentCompressedPay = b64; } }
    function evaluateMathAmount(expr) { if (!expr) return 0; const clean = expr.toString().replace(/[^0-9+\-*/.]/g, ""); try { const result = Function('"use strict";return (' + clean + ")")(); return isNaN(result) ? 0 : parseFloat(result); } catch (e) { return parseFloat(clean) || 0; } }

    async function handleFormSubmit(e) {
      e.preventDefault(); if(appState.trips.length === 0) { alert("Please create a Trip first!"); return; }
      const btn = document.getElementById("btnSaveExpense"); btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving...';
      const t = appState.trips.find(x=>x.id===appState.currentTripId);
      const amtExpr = document.getElementById("fieldAmount").value.trim(), evaluatedAmt = evaluateMathAmount(amtExpr);
      
      let payload = { id: "exp_" + Date.now(), tripId: appState.currentTripId, action: "addExpense", employeeName: appState.currentUser + " (" + appState.employeeId + ")", project: t.projectName, category: appState.activeCategory, date: document.getElementById("fieldDate").value, amount: evaluatedAmt, amountExpr: amtExpr, paymentType: document.getElementById("fieldPaymentType").value, remarks: document.getElementById("fieldRemarkNotes").value.trim(), billImage: currentCompressedBill, payImage: currentCompressedPay, status: "Pending" };
      
      if (appState.activeCategory === "Travel") { payload.origin = document.getElementById("travelOrigin").value.trim(); payload.destination = document.getElementById("travelDestination").value.trim(); payload.transportMode = document.getElementById("travelTransportMode").value; payload.purpose = document.getElementById("travelPurpose").value.trim(); payload.reason = payload.purpose || "Travel"; } 
      else if (appState.activeCategory === "Food") { const f = document.getElementById("foodReasonSelect").value; payload.reason = f === "Custom" ? document.getElementById("foodCustomReason").value.trim() : f; } 
      else if (appState.activeCategory === "Rent") { payload.roomLocation = document.getElementById("rentLocation").value.trim(); payload.rentType = document.getElementById("rentDurationType").value; payload.roomType = document.getElementById("rentRoomType").value; payload.reason = payload.roomLocation + " (" + payload.roomType + " - " + payload.rentType + ")"; } 
      else { payload.reason = document.getElementById("othersReason").value.trim() || "Expense"; }
      
      try {
        const r = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
        const res = await r.json();
        if(res.status==="success") { appState.expenses.push(payload); saveStorageData(); recalcStatsAndRender(); document.getElementById("expenseForm").reset(); currentCompressedBill=null; currentCompressedPay=null; alert("Saved successfully!"); } else alert("Error: " + res.message);
      } catch(err) { alert("Network Error: " + err.message); } finally { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Save to Database'; }
    }

    async function deleteExpense(expId) {
      if (!confirm("Permanently delete this expense?")) return;
      const exp = appState.expenses.find(e => e.id === expId); if (!exp) return;
      const payload = { action: "deleteExpense", employeeName: exp.employeeName, project: exp.project, date: exp.date, amount: exp.amount };
      appState.expenses = appState.expenses.filter(e => e.id !== expId); saveStorageData(); recalcStatsAndRender();
      fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    }

    function recalcStatsAndRender() {
      const trip = appState.trips.find(t => t.id === appState.currentTripId);
      const tripExpenses = appState.expenses.filter(e => e.project === (trip ? trip.projectName : ""));
      const grandTotal = tripExpenses.reduce((sum, item) => sum + (item.amount || 0), 0);
      const advance = trip ? (trip.advance || 0) : 0; const net = advance - grandTotal;

      document.getElementById("statTotalItems").innerText = tripExpenses.length; document.getElementById("statTotalExpenses").innerText = `₹${grandTotal.toFixed(2)}`;
      
      const netEl = document.getElementById("statNetBalance"); const netBadge = document.getElementById("netBalanceBadge"); const netIconBg = document.getElementById("netBalanceIconBg");
      if (net > 0) { netEl.className = "text-2xl font-bold text-emerald-600 mt-1"; netEl.innerText = `₹${net.toFixed(2)}`; netBadge.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700"; netBadge.innerText = "Return to Company"; netIconBg.className = "w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl"; } 
      else if (net < 0) { netEl.className = "text-2xl font-bold text-red-600 mt-1"; netEl.innerText = `₹${Math.abs(net).toFixed(2)}`; netBadge.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-700"; netBadge.innerText = "Company Owes You"; netIconBg.className = "w-12 h-12 bg-red-50 text-red-600 rounded-xl flex items-center justify-center text-xl"; } 
      else { netEl.className = "text-2xl font-bold text-slate-700 mt-1"; netEl.innerText = `₹0.00`; netBadge.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700"; netBadge.innerText = "Settled"; netIconBg.className = "w-12 h-12 bg-slate-50 text-slate-600 rounded-xl flex items-center justify-center text-xl"; }

      renderExpenseTable(tripExpenses);
    }

    function renderExpenseTable(tripExpenses) {
      const c = document.getElementById("expenseListContainer"); c.innerHTML = "";
      const filter = document.getElementById("categoryFilter").value;
      let items = tripExpenses;
      if(filter !== "All") items = items.filter(e=>e.category === filter);
      
      items.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(item => {
        const d = document.createElement("div"); d.className = "p-3 border border-slate-200 bg-slate-50 rounded-lg flex justify-between items-center";
        let attIcon = ""; if (item.billImage || item.payImage || item.billUrl || item.payUrl) attIcon = `<i class="fa-solid fa-paperclip text-blue-500 ml-2" title="Has Attachments"></i>`;
        
        // Status Badge
        let statusColor = "bg-amber-100 text-amber-700"; let statusText = item.status || "Pending";
        if (statusText === "Approved") statusColor = "bg-emerald-100 text-emerald-700";
        if (statusText === "Rejected") statusColor = "bg-red-100 text-red-700";
        const statusBadge = `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${statusColor} ml-2">${statusText}</span>`;

        // Admin Buttons
        let adminActions = "";
        if (appState.currentRole === "admin" && statusText === "Pending") {
          adminActions = `
            <div class="mt-2 flex space-x-2">
              <button onclick="updateExpenseStatus('${item.id}', 'Approved')" class="text-[10px] bg-emerald-50 text-emerald-600 border border-emerald-200 px-2 py-1 rounded hover:bg-emerald-100 transition"><i class="fa-solid fa-check mr-1"></i>Approve</button>
              <button onclick="updateExpenseStatus('${item.id}', 'Rejected')" class="text-[10px] bg-red-50 text-red-600 border border-red-200 px-2 py-1 rounded hover:bg-red-100 transition"><i class="fa-solid fa-xmark mr-1"></i>Reject</button>
            </div>
          `;
        }

        d.innerHTML = `
          <div>
            <div class="font-bold text-sm">${item.category} - ${item.reason} ${attIcon} ${statusBadge}</div>
            <div class="text-[11px] text-slate-500">${item.date} | ${appState.currentRole === "admin" ? item.employeeName + " | " : ""}${item.paymentType} ${item.remarks ? `(${item.remarks})` : ""}</div>
            ${adminActions}
          </div>
          <div class="text-right flex flex-col items-end">
            <div class="font-bold text-slate-900">₹${item.amount}</div>
            <button onclick="deleteExpense('${item.id}')" class="text-slate-400 hover:text-red-600 text-xs mt-1 transition" title="Delete Expense"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        `; c.appendChild(d);
      });
    }

    // --- EXPORTS ---
    async function downloadOrganizedReceiptsZip() {
      const trip = appState.trips.find(t => t.id === appState.currentTripId);
      const tripExpenses = appState.expenses.filter(e => e.project === (trip ? trip.projectName : ""));
      const itemsWithImages = tripExpenses.filter(e => e.billImage || e.payImage);
      if (itemsWithImages.length === 0) { alert("No receipt bills or payment screenshots have been uploaded for this trip yet!"); return; }

      const zip = new JSZip(); const projClean = (trip ? trip.projectName : "Trip").replace(/[^a-zA-Z0-9_-]/g, "_");
      const rootFolder = zip.folder(`${projClean}_Receipts`);
      const folderMap = {}; ["Travel", "Food", "Rent", "Others"].forEach(cat => { folderMap[cat] = { bills: rootFolder.folder(cat).folder("Bills"), payments: rootFolder.folder(cat).folder("Payments") }; });

      const nameCounters = {};
      itemsWithImages.forEach(item => {
        const cat = item.category || "Others", rawReason = item.reason || "Expense", cleanReason = rawReason.replace(/[^a-zA-Z0-9_-]/g, "_").substring(0, 20);
        const baseKey = `${item.date}_${cleanReason}`;
        if (!nameCounters[baseKey]) nameCounters[baseKey] = 0; nameCounters[baseKey]++;
        const suffix = nameCounters[baseKey] > 1 ? `_${nameCounters[baseKey]}` : "", finalFileName = `${baseKey}${suffix}.jpg`;

        if (item.billImage && item.billImage.startsWith("data:image")) folderMap[cat].bills.file(finalFileName, item.billImage.split(",")[1], { base64: true });
        if (item.payImage && item.payImage.startsWith("data:image")) folderMap[cat].payments.file(finalFileName, item.payImage.split(",")[1], { base64: true });
      });

      const blob = await zip.generateAsync({ type: "blob" });
      const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `${projClean}_Receipts.zip`;
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    function exportToStyledExcel() {
      const trip = appState.trips.find(t => t.id === appState.currentTripId);
      const tripExpenses = appState.expenses.filter(e => e.project === (trip ? trip.projectName : ""));
      const projName = trip ? trip.projectName : "Trip Expenses";

      const travelItems = tripExpenses.filter(e => e.category === "Travel"), foodItems = tripExpenses.filter(e => e.category === "Food"), miscItems = tripExpenses.filter(e => e.category === "Others" || e.category === "Rent");
      const travelSum = travelItems.reduce((acc, i) => acc + i.amount, 0), foodSum = foodItems.reduce((acc, i) => acc + i.amount, 0), miscSum = miscItems.reduce((acc, i) => acc + i.amount, 0), grandTotal = travelSum + foodSum + miscSum, advance = trip ? (trip.advance || 0) : 0;

      const fontCalibri = { name: "Calibri", sz: 11 }, borderThin = { top: { style: "thin", color: { rgb: "000000" } }, bottom: { style: "thin", color: { rgb: "000000" } }, left: { style: "thin", color: { rgb: "000000" } }, right: { style: "thin", color: { rgb: "000000" } } };
      const styleTitle = { font: { name: "Calibri", sz: 14, bold: true }, alignment: { horizontal: "center", vertical: "center" } };
      const styleBannerOrange = { fill: { fgColor: { rgb: "F79646" } }, font: { name: "Calibri", sz: 11, bold: true, color: { rgb: "000000" } }, alignment: { horizontal: "center", vertical: "center" }, border: borderThin };
      const styleHeaderBlue = { fill: { fgColor: { rgb: "BDD7EE" } }, font: { name: "Calibri", sz: 10, bold: true, color: { rgb: "000000" } }, alignment: { horizontal: "center", vertical: "center", wrapText: true }, border: borderThin };
      const styleDataCell = { font: fontCalibri, alignment: { horizontal: "center", vertical: "center" }, border: borderThin }, styleAmountGreen = { fill: { fgColor: { rgb: "C6EFCE" } }, font: { name: "Calibri", sz: 11, bold: true, color: { rgb: "006100" } }, alignment: { horizontal: "center", vertical: "center" }, border: borderThin }, styleTotalRed = { fill: { fgColor: { rgb: "FF0000" } }, font: { name: "Calibri", sz: 11, bold: true, color: { rgb: "FFFFFF" } }, alignment: { horizontal: "center", vertical: "center" }, border: borderThin }, styleSummaryGold = { fill: { fgColor: { rgb: "FFC000" } }, font: { name: "Calibri", sz: 10, bold: true, color: { rgb: "000000" } }, alignment: { horizontal: "center", vertical: "center" }, border: borderThin };

      const wb = XLSX.utils.book_new(), ws = {}, merges = [];
      function setCell(r, c, val, style) { ws[XLSX.utils.encode_cell({ r, c })] = { v: val, t: typeof val === "number" ? "n" : "s", s: style }; }

      setCell(1, 0, `${projName} Expenses Report`, styleTitle); merges.push({ s: { r: 1, c: 0 }, e: { r: 1, c: 7 } });

      let r = 3;
      setCell(r, 0, "Travel Expenses", styleBannerOrange); merges.push({ s: { r, c: 0 }, e: { r, c: 7 } }); r++;
      const travelHeaders = ["Date of Travel", "Purpose of Trip", "Origin", "Destination", "Mode of Transport", "Amount", "Total Amount", "Remarks"]; travelHeaders.forEach((h, idx) => setCell(r, idx, h, styleHeaderBlue)); r++;
      if (travelItems.length === 0) { [0,1,2,3,4,5,7].forEach(c => setCell(r, c, "-", styleDataCell)); setCell(r, 6, 0, styleAmountGreen); r++; } else { travelItems.forEach(item => { setCell(r,0,item.date,styleDataCell); setCell(r,1,item.purpose||"-",styleDataCell); setCell(r,2,item.origin||"-",styleDataCell); setCell(r,3,item.destination||"-",styleDataCell); setCell(r,4,item.transportMode||"-",styleDataCell); setCell(r,5,item.amountExpr||item.amount,styleDataCell); setCell(r,6,item.amount,styleAmountGreen); setCell(r,7,item.remarks||item.paymentType||"-",styleDataCell); r++; }); }
      setCell(r, 5, "Total", styleTotalRed); setCell(r, 6, travelSum, styleTotalRed); r += 2;

      setCell(r, 0, "Food Expenses", styleBannerOrange); merges.push({ s: { r, c: 0 }, e: { r, c: 4 } }); r++;
      const foodHeaders = ["DATE", "Reason", "Amount", "Remark", "Total"]; foodHeaders.forEach((h, idx) => setCell(r, idx, h, styleHeaderBlue)); r++;
      if (foodItems.length === 0) { [0,1,2,3].forEach(c => setCell(r, c, "-", styleDataCell)); setCell(r, 4, 0, styleAmountGreen); r++; } else { foodItems.forEach(item => { setCell(r,0,item.date,styleDataCell); setCell(r,1,item.reason||"-",styleDataCell); setCell(r,2,item.amountExpr||item.amount,styleDataCell); setCell(r,3,item.remarks||item.paymentType||"-",styleDataCell); setCell(r,4,item.amount,styleAmountGreen); r++; }); }
      setCell(r, 3, "Total", styleTotalRed); setCell(r, 4, foodSum, styleTotalRed); r += 2;

      setCell(r, 0, "Miscellaneous & Rent Expenses", styleBannerOrange); merges.push({ s: { r, c: 0 }, e: { r, c: 4 } }); r++;
      foodHeaders.forEach((h, idx) => setCell(r, idx, h, styleHeaderBlue)); r++;
      if (miscItems.length === 0) { [0,1,2,3].forEach(c => setCell(r, c, "-", styleDataCell)); setCell(r, 4, 0, styleAmountGreen); r++; } else { miscItems.forEach(item => { setCell(r,0,item.date,styleDataCell); setCell(r,1,item.reason||"-",styleDataCell); setCell(r,2,item.amountExpr||item.amount,styleDataCell); setCell(r,3,item.remarks||item.paymentType||"-",styleDataCell); setCell(r,4,item.amount,styleAmountGreen); r++; }); }
      setCell(r, 3, "Total", styleTotalRed); setCell(r, 4, miscSum, styleTotalRed);

      let rightR = 14;
      setCell(rightR, 6, "S.No", styleHeaderBlue); setCell(rightR, 7, "Advance", styleHeaderBlue); setCell(rightR, 8, "Amounts", styleHeaderBlue); rightR++;
      setCell(rightR, 6, 1, styleSummaryGold); setCell(rightR, 7, trip ? trip.employeeName : appState.currentUser, styleSummaryGold); setCell(rightR, 8, advance, styleAmountGreen); rightR += 2;

      setCell(rightR, 6, "S.No", styleHeaderBlue); setCell(rightR, 7, "Remark", styleHeaderBlue); setCell(rightR, 8, "Amounts", styleHeaderBlue); rightR++;
      setCell(rightR, 6, 1, styleSummaryGold); setCell(rightR, 7, "Travel Expenses", styleSummaryGold); setCell(rightR, 8, travelSum, styleAmountGreen); rightR++;
      setCell(rightR, 6, 2, styleSummaryGold); setCell(rightR, 7, "Food Expenses", styleSummaryGold); setCell(rightR, 8, foodSum, styleAmountGreen); rightR++;
      setCell(rightR, 6, 3, styleSummaryGold); setCell(rightR, 7, "Miscellaneous Expenses", styleSummaryGold); setCell(rightR, 8, miscSum, styleAmountGreen); rightR++;
      setCell(rightR, 6, "", styleTotalRed); setCell(rightR, 7, "Total", styleTotalRed); setCell(rightR, 8, grandTotal, styleTotalRed);

      ws["!cols"] = [{ wch: 14 }, { wch: 22 }, { wch: 16 }, { wch: 18 }, { wch: 22 }, { wch: 16 }, { wch: 16 }, { wch: 22 }, { wch: 14 }]; ws["!merges"] = merges; ws["!ref"] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(r, rightR) + 2, c: 8 } });
      XLSX.utils.book_append_sheet(wb, ws, "Expenses Report"); XLSX.writeFile(wb, `${(projName || "Expense_Report").replace(/[^a-zA-Z0-9_-]/g, "_")}.xlsx`);
    }
