<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Expense & Travel Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .zoho-red { background-color: #E42528; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- ========================================== -->
  <!-- AUTHENTICATION SCREEN -->
  <!-- ========================================== -->
  <div id="authScreen" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-8 shadow-2xl">
      <div class="flex justify-center mb-4"><div class="w-16 h-16 zoho-red rounded-2xl flex items-center justify-center text-white shadow-lg font-bold text-3xl"><i class="fa-solid fa-receipt"></i></div></div>
      <h2 id="authTitle" class="text-2xl font-bold text-center text-slate-900 mb-1">Company Portal</h2>
      <p id="authSubtitle" class="text-center text-sm text-slate-500 mb-6">Sign in to manage your expenses</p>
      
      <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        <div id="nameFieldGroup" class="hidden"><label class="block text-xs font-bold text-slate-700 mb-1">Display Name <span class="text-red-500">*</span></label><input type="text" id="authName" class="w-full text-sm p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-500" /></div>
        <div><label id="authIdLabel" class="block text-xs font-bold text-slate-700 mb-1">Employee ID or Email <span class="text-red-500">*</span></label><input type="text" id="authId" required class="w-full text-sm p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-500" /></div>
        <div id="emailFieldGroup" class="hidden"><label class="block text-xs font-bold text-slate-700 mb-1">Email Address <span class="text-red-500">*</span></label><input type="email" id="authEmail" class="w-full text-sm p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-500" /></div>
        <div><label class="block text-xs font-bold text-slate-700 mb-1">Password <span class="text-red-500">*</span></label><input type="password" id="authPassword" required class="w-full text-sm p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-500" /></div>
        <button type="submit" id="authSubmitBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg shadow-md transition mt-2">Secure Login <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i></button>
      </form>
      <div class="mt-6 text-center border-t border-slate-100 pt-4"><button onclick="toggleAuthMode()" id="authToggleBtn" class="text-sm font-semibold text-slate-600 hover:text-red-600 transition">New employee? Create an account</button></div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- MAIN APPLICATION -->
  <!-- ========================================== -->
  <div id="mainApp" class="hidden flex-col min-h-screen w-full">
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center space-x-3"><div class="w-10 h-10 zoho-red rounded-lg flex items-center justify-center text-white shadow-sm font-bold text-xl"><i class="fa-solid fa-receipt"></i></div><div><h1 class="font-bold text-lg leading-tight">Expense & Travel Portal</h1><p class="text-xs text-slate-400">Client-Site Reimbursements (INR ₹)</p></div></div>
        <div class="flex items-center space-x-3">
          
          <!-- ADMIN ROLE SWITCHER (Strictly Hidden by Default) -->
          <div id="adminControlsContainer" style="display: none;" class="items-center bg-slate-800 rounded-lg p-1 border border-slate-700 text-xs">
            <button id="roleEmployeeBtn" onclick="switchRole('employee')" class="px-3 py-1 rounded bg-red-600 text-white font-medium transition"><i class="fa-solid fa-user mr-1"></i> My Data</button>
            <button id="roleAdminBtn" onclick="switchRole('admin')" class="px-3 py-1 rounded text-slate-300 hover:text-white font-medium transition"><i class="fa-solid fa-user-shield mr-1"></i> Admin View</button>
          </div>

          <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700"><i class="fa-solid fa-circle-user text-red-400"></i><span id="navEmployeeName" class="text-xs font-semibold text-slate-200 truncate max-w-[120px]">User</span><button onclick="openProfileModal()" class="text-slate-400 hover:text-white text-xs ml-1"><i class="fa-solid fa-pen"></i></button></div>
          <button onclick="logout()" class="bg-slate-800 hover:bg-red-600 border border-slate-700 text-slate-300 hover:text-white px-3 py-1.5 rounded-lg transition text-xs font-bold flex items-center"><i class="fa-solid fa-right-from-bracket sm:mr-1"></i> <span class="hidden sm:inline">Sign Out</span></button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full">
      <!-- TRIP SELECTOR -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 flex flex-wrap justify-between items-center gap-4">
        <div class="flex flex-wrap items-center gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Current Active Trip</label>
            <div class="flex items-center space-x-2">
              <select id="tripSelect" onchange="onTripChange()" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-red-500 block p-2 font-medium"></select>
              <button onclick="openTripModal(true)" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm transition" title="Edit Trip"><i class="fa-solid fa-pen-to-square"></i></button>
              <button onclick="deleteCurrentTrip()" class="p-2 bg-red-50 hover:bg-red-100 border border-red-100 text-red-600 rounded-lg text-sm transition" title="Delete Trip"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
          <div class="border-l border-slate-200 pl-4 hidden md:block"><div class="text-xs text-slate-500 font-medium">Trip Duration:</div><div id="tripDurationDisplay" class="text-sm font-semibold text-slate-800">--</div></div>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="openTripModal(false)" class="bg-slate-800 hover:bg-slate-900 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-lg shadow-sm transition"><i class="fa-solid fa-plus mr-1.5"></i> New Trip</button>
          <button onclick="exportToStyledExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-lg shadow-sm transition"><i class="fa-solid fa-file-excel mr-1.5"></i> Export Excel</button>
          <button onclick="downloadOrganizedReceiptsZip()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-lg shadow-sm transition"><i class="fa-solid fa-file-zipper mr-1.5"></i> Receipts (.zip)</button>
        </div>
      </div>

      <!-- SUMMARY CARDS -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center justify-between"><div><p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Items</p><h3 id="statTotalItems" class="text-2xl font-bold text-slate-800 mt-1">0</h3></div><div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-list-check"></i></div></div>
        <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center justify-between"><div><p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Expenses</p><h3 id="statTotalExpenses" class="text-2xl font-bold text-red-600 mt-1">₹0.00</h3></div><div class="w-12 h-12 bg-red-50 text-red-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-indian-rupee-sign"></i></div></div>
        <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center justify-between"><div class="w-full mr-2"><p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Company Advance</p><div class="flex items-center mt-1"><span class="text-lg font-bold text-emerald-600 mr-1">₹</span><input type="number" id="statAdvanceInput" onchange="updateTripAdvance(this.value)" class="w-full text-xl font-bold text-emerald-600 bg-transparent border-b border-dashed focus:outline-none" value="0" /></div></div><div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-hand-holding-dollar"></i></div></div>
        <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center justify-between"><div><p id="netBalanceLabel" class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Net Balance</p><h3 id="statNetBalance" class="text-2xl font-bold text-slate-800 mt-1">₹0.00</h3><span id="netBalanceBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">Settled</span></div><div id="netBalanceIconBg" class="w-12 h-12 bg-slate-50 text-slate-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-scale-balanced"></i></div></div>
      </div>

      <!-- MAIN INPUT GRID -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-5 bg-white rounded-xl border border-slate-200 shadow-sm p-5">
          <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4"><h2 class="font-bold text-base text-slate-900 flex items-center"><i class="fa-solid fa-circle-plus text-red-600 mr-2"></i> Log New Expense</h2></div>
          <div class="grid grid-cols-4 gap-1 bg-slate-100 p-1 rounded-lg mb-4 text-xs font-medium">
            <button type="button" onclick="setExpenseType('Travel')" id="tab-Travel" class="py-2 rounded-md transition shadow-sm bg-white text-red-600 font-bold">Travel</button>
            <button type="button" onclick="setExpenseType('Food')" id="tab-Food" class="py-2 rounded-md transition text-slate-600">Food</button>
            <button type="button" onclick="setExpenseType('Rent')" id="tab-Rent" class="py-2 rounded-md transition text-slate-600">Rent</button>
            <button type="button" onclick="setExpenseType('Others')" id="tab-Others" class="py-2 rounded-md transition text-slate-600">Others</button>
          </div>
          <form id="expenseForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div><label class="block text-xs font-bold text-slate-700 mb-1">Expense Date *</label><input type="date" id="fieldDate" required class="w-full text-xs p-2.5 rounded-lg border border-slate-300" /></div>
              <div><label class="block text-xs font-bold text-slate-700 mb-1">Amount (₹) *</label><input type="text" id="fieldAmount" placeholder="e.g. 100+250" required class="w-full text-xs p-2.5 rounded-lg border border-slate-300" /></div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Payment Method / Notes *</label>
              <div class="grid grid-cols-3 gap-2">
                <select id="fieldPaymentType" required class="col-span-1 text-xs p-2.5 rounded-lg border border-slate-300 bg-white"><option>UPI</option><option>Cash</option><option>Card</option></select>
                <input type="text" id="fieldRemarkNotes" placeholder="Optional notes" class="col-span-2 text-xs p-2.5 rounded-lg border border-slate-300" />
              </div>
            </div>
            
            <div id="fieldsTravel" class="space-y-3 p-3 bg-red-50/50 rounded-lg border border-red-100">
              <input type="text" id="travelOrigin" placeholder="Origin *" class="w-full text-xs p-2 rounded border border-slate-300 mb-2" />
              <input type="text" id="travelDestination" placeholder="Destination *" class="w-full text-xs p-2 rounded border border-slate-300 mb-2" />
              <input type="text" id="travelPurpose" placeholder="Purpose *" class="w-full text-xs p-2 rounded border border-slate-300 mb-2" />
              <select id="travelTransportMode" class="w-full text-xs p-2 rounded border border-slate-300 bg-white"><option>Cab</option><option>Auto</option><option>Train</option><option>Flight</option></select>
            </div>
            <div id="fieldsFood" class="hidden space-y-3 p-3 bg-amber-50/50 rounded-lg border border-amber-100">
              <select id="foodReasonSelect" onchange="handleFoodReasonChange(this.value)" class="w-full text-xs p-2 rounded border border-slate-300 bg-white"><option value="Breakfast">Breakfast</option><option value="Lunch">Lunch</option><option value="Dinner">Dinner</option><option value="Snacks">Snacks</option><option value="Custom">Other (Custom)</option></select>
              <div id="foodCustomReasonDiv" class="hidden mt-2"><input type="text" id="foodCustomReason" placeholder="Specify food reason..." class="w-full text-xs p-2 rounded border border-slate-300" /></div>
            </div>
            <div id="fieldsRent" class="hidden space-y-3 p-3 bg-blue-50/50 rounded-lg border border-blue-100">
              <input type="text" id="rentLocation" placeholder="Location *" class="w-full text-xs p-2 rounded border border-slate-300 mb-2" />
              <select id="rentDurationType" class="w-full text-xs p-2 rounded border border-slate-300 bg-white"><option>Per Day</option><option>Per Month</option></select>
              <select id="rentRoomType" class="w-full text-xs p-2 rounded border border-slate-300 bg-white mt-2"><option>Hotel</option><option>Guest House</option><option>PG</option></select>
            </div>
            <div id="fieldsOthers" class="hidden space-y-3 p-3 bg-purple-50/50 rounded-lg border border-purple-100">
              <input type="text" id="othersReason" placeholder="Description / Reason *" class="w-full text-xs p-2 rounded border border-slate-300" />
            </div>
            
            <div class="border-t border-slate-200 pt-3 space-y-3">
              <label class="block text-xs font-bold text-slate-700">Receipts (Optional JPG)</label>
              <div class="grid grid-cols-2 gap-3">
                <input type="file" id="fileBill" accept="image/*" onchange="previewImageFile(this, 'fileBill')" class="text-[10px]" />
                <input type="file" id="filePayment" accept="image/*" onchange="previewImageFile(this, 'filePayment')" class="text-[10px]" />
              </div>
            </div>
            <button type="submit" id="btnSaveExpense" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg"><i class="fa-solid fa-cloud-arrow-up"></i> Save to Database</button>
          </form>
        </div>
        
        <div class="lg:col-span-7 bg-white rounded-xl border border-slate-200 shadow-sm p-5 flex flex-col">
          <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
            <h2 class="font-bold text-base text-slate-900">Logged Items</h2>
            <div class="flex space-x-2">
              <select id="categoryFilter" onchange="recalcStatsAndRender()" class="text-xs p-1.5 rounded-md border border-slate-300 bg-slate-50"><option value="All">All Categories</option><option value="Travel">Travel</option><option value="Food">Food</option><option value="Rent">Rent</option><option value="Others">Others</option></select>
            </div>
          </div>
          <div id="expenseListContainer" class="flex-1 overflow-y-auto max-h-[560px] space-y-2.5 pr-1"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- ========================================== -->
  <!-- MODALS -->
  <!-- ========================================== -->
  <div id="profileModal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-xl w-full max-w-sm"><h3 class="font-bold text-lg mb-4">Edit Profile</h3>
      <form onsubmit="handleProfileSubmit(event)" class="space-y-4">
        <input type="text" id="modalProfileName" class="w-full p-2 border rounded text-sm" placeholder="Display Name" />
        <input type="text" id="modalProfileId" class="w-full p-2 border rounded text-sm" placeholder="Employee ID" />
        <input type="email" id="modalProfileEmail" class="w-full p-2 border rounded text-sm" placeholder="Email" />
        <input type="text" id="modalProfilePassword" class="w-full p-2 border rounded text-sm" placeholder="Password" />
        <button type="submit" id="btnUpdateProfile" class="w-full bg-red-600 text-white p-2 rounded font-bold">Save</button>
        <button type="button" onclick="closeProfileModal()" class="w-full p-2 text-slate-500 font-medium hover:bg-slate-100 rounded">Cancel</button>
      </form>
    </div>
  </div>

  <div id="tripModal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-xl w-full max-w-md"><h3 id="modalTripTitle" class="font-bold text-lg mb-4">Trip Details</h3>
      <form onsubmit="handleTripModalSubmit(event)" class="space-y-4">
        <div><label class="text-xs font-bold text-slate-700">Project Name</label><input type="text" id="modalProjectName" required class="w-full p-2 border rounded" /></div>
        <div class="flex gap-2">
          <div class="w-1/2"><label class="text-xs font-bold text-slate-700">Start Date</label><input type="date" id="modalStartDate" required class="w-full p-2 border rounded text-sm" /></div>
          <div class="w-1/2"><label class="text-xs font-bold text-slate-700">End Date</label><input type="date" id="modalEndDate" required class="w-full p-2 border rounded text-sm" /></div>
        </div>
        <div><label class="text-xs font-bold text-slate-700">Initial Advance (₹)</label><input type="number" id="modalAdvance" placeholder="0" class="w-full p-2 border rounded" /></div>
        <button type="submit" id="btnSaveTrip" class="w-full bg-red-600 text-white font-bold p-2 rounded">Save Trip</button>
        <button type="button" onclick="closeTripModal()" class="w-full p-2 text-slate-500 font-medium hover:bg-slate-100 rounded">Cancel</button>
      </form>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- JAVASCRIPT APP LOGIC -->
  <!-- ========================================== -->
  <script>
    // -------------------------------------------------------------
    // PASTE YOUR LATEST GOOGLE APPS SCRIPT URL HERE
    // -------------------------------------------------------------
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbweeQZKcjsDOeAMOwm6ezE6Md86xltdeii26F2_vhOfLVYa5IRSdrgtuF07NScHyNIu0w/exec";

    let appState = { 
      currentUser: "", employeeId: "", email: "", password: "", userRole: "Employee", currentRole: "employee",
      currentTripId: null, activeCategory: "Travel", 
      trips: [], expenses: [],
      personalTrips: [], personalExpenses: []
    };
    let sessionTimeoutTracker; let authMode = "login"; 

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("fieldDate").value = new Date().toISOString().split("T")[0];
      checkSession();
    });

    // --- AUTHENTICATION & ROLE MGMT ---
    function toggleAuthMode() {
      authMode = authMode === "login" ? "register" : "login";
      document.getElementById("nameFieldGroup").classList.toggle("hidden", authMode === "login");
      document.getElementById("emailFieldGroup").classList.toggle("hidden", authMode === "login");
      document.getElementById("authName").required = authMode === "register";
      document.getElementById("authEmail").required = authMode === "register";
      document.getElementById("authIdLabel").innerHTML = authMode === "login" ? 'Employee ID or Email <span class="text-red-500">*</span>' : 'Employee ID <span class="text-red-500">*</span>';
      document.getElementById("authTitle").innerText = authMode === "login" ? "Company Portal" : "Create Account";
      document.getElementById("authSubtitle").innerText = authMode === "login" ? "Sign in to manage your expenses" : "Register as a new employee";
      document.getElementById("authSubmitBtn").innerHTML = authMode === "login" ? 'Secure Login <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>' : 'Register Account <i class="fa-solid fa-user-plus ml-2"></i>';
      document.getElementById("authToggleBtn").innerText = authMode === "login" ? "New employee? Create an account" : "Already have an account? Sign In";
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("authSubmitBtn"); const originalHtml = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...'; btn.disabled = true;

      const payload = { action: authMode, name: document.getElementById("authName").value.trim(), empId: document.getElementById("authId").value.trim(), email: document.getElementById("authEmail").value.trim(), password: document.getElementById("authPassword").value.trim() };
      if (authMode === "login") payload.loginId = document.getElementById("authId").value.trim();

      try {
        const response = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
        const result = await response.json();
        
        if (result.status === "success") {
          if (authMode === "register") {
            alert("Account created! Please log in.");
            toggleAuthMode();
            document.getElementById("authId").value = payload.empId; document.getElementById("authPassword").value = "";
          } else {
            appState.currentUser = result.user.name; appState.employeeId = result.user.empId; appState.email = result.user.email; appState.password = result.user.password;
            appState.userRole = result.user.role ? String(result.user.role).trim() : "Employee";
            
            if(appState.userRole === "Admin") {
              document.getElementById("adminControlsContainer").style.display = "flex";
              appState.currentRole = "admin";
            } else {
              document.getElementById("adminControlsContainer").style.display = "none";
              appState.currentRole = "employee";
            }

            appState.personalTrips = result.trips && result.trips.length > 0 ? result.trips : [];
            appState.personalExpenses = result.expenses && result.expenses.length > 0 ? result.expenses : [];
            appState.trips = [...appState.personalTrips]; appState.expenses = [...appState.personalExpenses];
            appState.currentTripId = appState.trips.length > 0 ? appState.trips[0].id : null;
            
            localStorage.setItem("expense_session_expiry", Date.now() + (60 * 60 * 1000));
            saveStorageData(); 
            
            if(appState.userRole === "Admin") { showMainApp(); await fetchAllCompanyData(); } 
            else { showMainApp(); }
            
            document.getElementById("authForm").reset();
          }
        } else alert(result.message);
      } catch (err) { alert("Network Error: Ensure your Google Script URL is pasted on line 316."); }
      finally { btn.innerHTML = originalHtml; btn.disabled = false; }
    }

    async function switchRole(role) {
      appState.currentRole = role;
      const empBtn = document.getElementById("roleEmployeeBtn"); const admBtn = document.getElementById("roleAdminBtn");
      
      if (role === "admin") {
        admBtn.className = "px-3 py-1 rounded bg-amber-600 text-white font-medium transition";
        empBtn.className = "px-3 py-1 rounded text-slate-300 hover:text-white font-medium transition";
        await fetchAllCompanyData();
      } else {
        empBtn.className = "px-3 py-1 rounded bg-red-600 text-white font-medium transition";
        admBtn.className = "px-3 py-1 rounded text-slate-300 hover:text-white font-medium transition";
        appState.trips = [...appState.personalTrips]; appState.expenses = [...appState.personalExpenses];
        appState.currentTripId = appState.trips.length > 0 ? appState.trips[0].id : null;
        renderTripDropdown(); recalcStatsAndRender();
      }
    }

    async function fetchAllCompanyData() {
      document.getElementById("tripSelect").innerHTML = '<option>Loading company data...</option>';
      try {
        const payload = { action: "fetchAdminData" };
        const r = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
        const res = await r.json();
        if(res.status === "success") {

      const wb = XLSX.utils.book_new(), ws = {}, merges = []; function setCell(r, c, val, style) { ws[XLSX.utils.encode_cell({ r, c })] = { v: val, t: typeof val === "number" ? "n" : "s", s: style }; }

      let r = 3;
      setCell(r, 0, "Travel Expenses", styleBannerOrange); merges.push({ s: { r, c: 0 }, e: { r, c: 8 } }); r++;
      const travelHeaders = ["Date of Travel", "Purpose of Trip", "Origin", "Destination", "Mode of Transport", "Amount", "Total Amount", "Remarks", "Status"]; travelHeaders.forEach((h, idx) => setCell(r, idx, h, styleHeaderBlue)); r++;
      if (travelItems.length === 0) { [0,1,2,3,4,5,7,8].forEach(c => setCell(r, c, "-", styleDataCell)); setCell(r, 6, 0, styleAmountGreen); r++; } else { travelItems.forEach(item => { setCell(r,0,item.date,styleDataCell); setCell(r,1,item.purpose||"-",styleDataCell); setCell(r,2,item.origin||"-",styleDataCell); setCell(r,3,item.destination||"-",styleDataCell); setCell(r,4,item.transportMode||"-",styleDataCell); setCell(r,5,item.amountExpr||item.amount,styleDataCell); setCell(r,6,item.amount,styleAmountGreen); setCell(r,7,item.remarks||item.paymentType||"-",styleDataCell); setCell(r,8,item.status||"Pending",styleDataCell); r++; }); }
      setCell(r, 5, "Total", styleTotalRed); setCell(r, 6, travelSum, styleTotalRed); r += 2;

      setCell(r, 0, "Food Expenses", styleBannerOrange); merges.push({ s: { r, c: 0 }, e: { r, c: 5 } }); r++;
      const foodHeaders = ["DATE", "Reason", "Amount", "Remark", "Total", "Status"]; foodHeaders.forEach((h, idx) => setCell(r, idx, h, styleHeaderBlue)); r++;
      if (foodItems.length === 0) { [0,1,2,3,5].forEach(c => setCell(r, c, "-", styleDataCell)); setCell(r, 4, 0, styleAmountGreen); r++; } else { foodItems.forEach(item => { setCell(r,0,item.date,styleDataCell); setCell(r,1,item.reason||"-",styleDataCell); setCell(r,2,item.amountExpr||item.amount,styleDataCell); setCell(r,3,item.remarks||item.paymentType||"-",styleDataCell); setCell(r,4,item.amount,styleAmountGreen); setCell(r,5,item.status||"Pending",styleDataCell); r++; }); }
      setCell(r, 3, "Total", styleTotalRed); setCell(r, 4, foodSum, styleTotalRed); r += 2;

      setCell(r, 0, "Miscellaneous & Rent Expenses", styleBannerOrange); merges.push({ s: { r, c: 0 }, e: { r, c: 5 } }); r++;
      foodHeaders.forEach((h, idx) => setCell(r, idx, h, styleHeaderBlue)); r++;
      if (miscItems.length === 0) { [0,1,2,3,5].forEach(c => setCell(r, c, "-", styleDataCell)); setCell(r, 4, 0, styleAmountGreen); r++; } else { miscItems.forEach(item => { setCell(r,0,item.date,styleDataCell); setCell(r,1,item.reason||"-",styleDataCell); setCell(r,2,item.amountExpr||item.amount,styleDataCell); setCell(r,3,item.remarks||item.paymentType||"-",styleDataCell); setCell(r,4,item.amount,styleAmountGreen); setCell(r,5,item.status||"Pending",styleDataCell); r++; }); }
      setCell(r, 3, "Total", styleTotalRed); setCell(r, 4, miscSum, styleTotalRed);

      let rightR = 14;
      setCell(rightR, 6, "S.No", styleHeaderBlue); setCell(rightR, 7, "Advance", styleHeaderBlue); setCell(rightR, 8, "Amounts", styleHeaderBlue); rightR++;
      setCell(rightR, 6, 1, styleSummaryGold); setCell(rightR, 7, trip ? trip.employeeName : appState.currentUser, styleSummaryGold); setCell(rightR, 8, advance, styleAmountGreen); rightR += 2;

      setCell(rightR, 6, "S.No", styleHeaderBlue); setCell(rightR, 7, "Remark", styleHeaderBlue); setCell(rightR, 8, "Amounts", styleHeaderBlue); rightR++;
      setCell(rightR, 6, 1, styleSummaryGold); setCell(rightR, 7, "Travel Expenses", styleSummaryGold); setCell(rightR, 8, travelSum, styleAmountGreen); rightR++;
      setCell(rightR, 6, 2, styleSummaryGold); setCell(rightR, 7, "Food Expenses", styleSummaryGold); setCell(rightR, 8, foodSum, styleAmountGreen); rightR++;
      setCell(rightR, 6, 3, styleSummaryGold); setCell(rightR, 7, "Miscellaneous Expenses", styleSummaryGold); setCell(rightR, 8, miscSum, styleAmountGreen); rightR++;
      setCell(rightR, 6, "", styleTotalRed); setCell(rightR, 7, "Total", styleTotalRed); setCell(rightR, 8, grandTotal, styleTotalRed);

      ws["!cols"] = [{ wch: 14 }, { wch: 22 }, { wch: 16 }, { wch: 18 }, { wch: 22 }, { wch: 16 }, { wch: 16 }, { wch: 22 }, { wch: 14 }]; ws["!merges"] = merges; ws["!ref"] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(r, rightR) + 2, c: 9 } });
      XLSX.utils.book_append_sheet(wb, ws, "Expenses Report"); XLSX.writeFile(wb, `${(projName || "Expense_Report").replace(/[^a-zA-Z0-9_-]/g, "_")}.xlsx`);
    }
  </script>
