<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Expense & Travel Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .zoho-red { background-color: #E42528; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- AUTHENTICATION SCREEN -->
  <div id="authScreen" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-8 shadow-2xl">
      <div class="flex justify-center mb-4"><div class="w-16 h-16 zoho-red rounded-2xl flex items-center justify-center text-white shadow-lg font-bold text-3xl"><i class="fa-solid fa-receipt"></i></div></div>
      <h2 id="authTitle" class="text-2xl font-bold text-center text-slate-900 mb-1">Company Portal</h2>
      <p id="authSubtitle" class="text-center text-sm text-slate-500 mb-6">Sign in to manage your expenses</p>
      <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        <div id="nameFieldGroup" class="hidden"><label class="block text-xs font-bold text-slate-700 mb-1">Display Name *</label><input type="text" id="authName" class="w-full text-sm p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-500" /></div>
        <div><label id="authIdLabel" class="block text-xs font-bold text-slate-700 mb-1">Employee ID or Email *</label><input type="text" id="authId" required class="w-full text-sm p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-500" /></div>
        <div id="emailFieldGroup" class="hidden"><label class="block text-xs font-bold text-slate-700 mb-1">Email Address *</label><input type="email" id="authEmail" class="w-full text-sm p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-500" /></div>
        <div><label class="block text-xs font-bold text-slate-700 mb-1">Password *</label><input type="password" id="authPassword" required class="w-full text-sm p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-500" /></div>
        <button type="submit" id="authSubmitBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition mt-2">Secure Login <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i></button>
      </form>
      <div class="mt-6 text-center border-t border-slate-100 pt-4"><button onclick="toggleAuthMode()" id="authToggleBtn" class="text-sm font-semibold text-slate-600 hover:text-red-600 transition">New employee? Create an account</button></div>
    </div>
  </div>

  <!-- MAIN APPLICATION -->
  <div id="mainApp" class="hidden flex-col min-h-screen w-full">
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center space-x-3"><div class="w-10 h-10 zoho-red rounded-lg flex items-center justify-center text-white shadow-sm font-bold text-xl"><i class="fa-solid fa-receipt"></i></div><div><h1 class="font-bold text-lg leading-tight">Expense & Travel Portal</h1><p class="text-xs text-slate-400">Client-Site Reimbursements (INR ₹)</p></div></div>
        <div class="flex items-center space-x-3">
          <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700"><i class="fa-solid fa-circle-user text-red-400"></i><span id="navEmployeeName" class="text-xs font-semibold text-slate-200 truncate max-w-[120px]">User</span><button onclick="openProfileModal()" title="Edit Account Details" class="text-slate-400 hover:text-white text-xs ml-1"><i class="fa-solid fa-pen"></i></button></div>
          <button onclick="logout()" title="Sign Out" class="bg-slate-800 hover:bg-red-600 border border-slate-700 text-slate-300 hover:text-white px-3 py-1.5 rounded-lg transition text-xs font-bold flex items-center"><i class="fa-solid fa-right-from-bracket sm:mr-1"></i> <span class="hidden sm:inline">Sign Out</span></button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full">
      <!-- TRIP SELECTOR -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 flex flex-wrap justify-between items-center gap-4">
        <div class="flex flex-wrap items-center gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Current Active Trip</label>
            <div class="flex items-center space-x-2">
              <select id="tripSelect" onchange="onTripChange()" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-red-500 block p-2 font-medium"></select>
              <button onclick="openTripModal(true)" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm transition" title="Edit Trip Details"><i class="fa-solid fa-pen-to-square"></i></button>
              
              <!-- NEW: DELETE TRIP BUTTON -->
              <button onclick="deleteCurrentTrip()" class="p-2 bg-red-50 hover:bg-red-100 border border-red-100 text-red-600 rounded-lg text-sm transition" title="Delete Entire Trip Permanently"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
          <div class="border-l border-slate-200 pl-4 hidden md:block"><div class="text-xs text-slate-500 font-medium">Trip Duration:</div><div id="tripDurationDisplay" class="text-sm font-semibold text-slate-800">--</div></div>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="openTripModal(false)" class="bg-slate-800 hover:bg-slate-900 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-lg shadow-sm transition"><i class="fa-solid fa-plus mr-1.5"></i> New Trip</button>
          <button onclick="exportToStyledExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-lg shadow-sm transition"><i class="fa-solid fa-file-excel mr-1.5"></i> Export Excel</button>
          <button onclick="downloadOrganizedReceiptsZip()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-lg shadow-sm transition"><i class="fa-solid fa-file-zipper mr-1.5"></i> Receipts (.zip)</button>
        </div>
      </div>

      <!-- SUMMARY CARDS -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center justify-between"><div><p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Items</p><h3 id="statTotalItems" class="text-2xl font-bold text-slate-800 mt-1">0</h3></div><div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-list-check"></i></div></div>
        <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center justify-between"><div><p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Expenses</p><h3 id="statTotalExpenses" class="text-2xl font-bold text-red-600 mt-1">₹0.00</h3></div><div class="w-12 h-12 bg-red-50 text-red-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-indian-rupee-sign"></i></div></div>
        <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center justify-between"><div class="w-full mr-2"><p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Company Advance</p><div class="flex items-center mt-1"><span class="text-lg font-bold text-emerald-600 mr-1">₹</span><input type="number" id="statAdvanceInput" onchange="updateTripAdvance(this.value)" class="w-full text-xl font-bold text-emerald-600 bg-transparent border-b border-dashed focus:outline-none" value="0" /></div></div><div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-hand-holding-dollar"></i></div></div>
        <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center justify-between"><div><p id="netBalanceLabel" class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Net Balance</p><h3 id="statNetBalance" class="text-2xl font-bold text-slate-800 mt-1">₹0.00</h3><span id="netBalanceBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">Settled</span></div><div id="netBalanceIconBg" class="w-12 h-12 bg-slate-50 text-slate-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-scale-balanced"></i></div></div>
      </div>

      <!-- MAIN INTERACTIVE GRID -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-5 bg-white rounded-xl border border-slate-200 shadow-sm p-5">
          <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4"><h2 class="font-bold text-base text-slate-900 flex items-center"><i class="fa-solid fa-circle-plus text-red-600 mr-2"></i> Log New Expense</h2></div>
          <div class="grid grid-cols-4 gap-1 bg-slate-100 p-1 rounded-lg mb-4 text-xs font-medium">
            <button type="button" onclick="setExpenseType('Travel')" id="tab-Travel" class="py-2 rounded-md transition shadow-sm bg-white text-red-600 font-bold">Travel</button>
            <button type="button" onclick="setExpenseType('Food')" id="tab-Food" class="py-2 rounded-md transition text-slate-600">Food</button>
            <button type="button" onclick="setExpenseType('Rent')" id="tab-Rent" class="py-2 rounded-md transition text-slate-600">Rent</button>
            <button type="button" onclick="setExpenseType('Others')" id="tab-Others" class="py-2 rounded-md transition text-slate-600">Others</button>
          </div>
          <form id="expenseForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div><label class="block text-xs font-bold text-slate-700 mb-1">Expense Date *</label><input type="date" id="fieldDate" required class="w-full text-xs p-2.5 rounded-lg border border-slate-300" /></div>
              <div><label class="block text-xs font-bold text-slate-700 mb-1">Amount (₹) *</label><input type="text" id="fieldAmount" required class="w-full text-xs p-2.5 rounded-lg border border-slate-300" /></div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Payment Method / Notes *</label>
              <div class="grid grid-cols-3 gap-2">
                <select id="fieldPaymentType" required class="col-span-1 text-xs p-2.5 rounded-lg border border-slate-300"><option>UPI</option><option>Cash</option></select>
                <input type="text" id="fieldRemarkNotes" class="col-span-2 text-xs p-2.5 rounded-lg border border-slate-300" />
              </div>
            </div>
            
            <div id="fieldsTravel" class="space-y-3 p-3 bg-red-50/50 rounded-lg border border-red-100">
              <input type="text" id="travelOrigin" placeholder="Origin" class="w-full text-xs p-2 rounded border border-slate-300 mb-2" />
              <input type="text" id="travelDestination" placeholder="Destination" class="w-full text-xs p-2 rounded border border-slate-300 mb-2" />
              <input type="text" id="travelPurpose" placeholder="Purpose" class="w-full text-xs p-2 rounded border border-slate-300 mb-2" />
              <select id="travelTransportMode" class="w-full text-xs p-2 rounded border border-slate-300 bg-white"><option>Cab</option><option>Auto</option><option>Train</option><option>Flight</option></select>
            </div>
            <div id="fieldsFood" class="hidden space-y-3 p-3 bg-amber-50/50 rounded-lg border border-amber-100">
              <input type="text" id="foodReasonSelect" placeholder="Meal Reason" class="w-full text-xs p-2 rounded border border-slate-300" />
            </div>
            <div id="fieldsRent" class="hidden space-y-3 p-3 bg-blue-50/50 rounded-lg border border-blue-100">
              <input type="text" id="rentLocation" placeholder="Location" class="w-full text-xs p-2 rounded border border-slate-300 mb-2" />
              <select id="rentDurationType" class="w-full text-xs p-2 rounded border border-slate-300 bg-white"><option>Per Day</option><option>Per Month</option></select>
              <select id="rentRoomType" class="w-full text-xs p-2 rounded border border-slate-300 bg-white"><option>Hotel</option><option>Guest House</option></select>
            </div>
            <div id="fieldsOthers" class="hidden space-y-3 p-3 bg-purple-50/50 rounded-lg border border-purple-100">
              <input type="text" id="othersReason" placeholder="Reason" class="w-full text-xs p-2 rounded border border-slate-300" />
            </div>
            
            <div class="border-t border-slate-200 pt-3 space-y-3">
              <label class="block text-xs font-bold text-slate-700">Receipts (Optional JPG)</label>
              <div class="grid grid-cols-2 gap-3">
                <input type="file" id="fileBill" accept="image/*" onchange="previewImageFile(this, 'fileBill')" class="text-[10px]" />
                <input type="file" id="filePayment" accept="image/*" onchange="previewImageFile(this, 'filePayment')" class="text-[10px]" />
              </div>
            </div>
            <button type="submit" id="btnSaveExpense" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg"><i class="fa-solid fa-cloud-arrow-up"></i> Save to Database</button>
          </form>
        </div>
        
        <div class="lg:col-span-7 bg-white rounded-xl border border-slate-200 shadow-sm p-5">
          <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
            <h2 class="font-bold text-base text-slate-900">Logged Items</h2>
            <div class="flex space-x-2">
              <select id="categoryFilter" onchange="renderExpenseTable()" class="text-xs p-1.5 rounded-md border border-slate-300"><option value="All">All Categories</option><option value="Travel">Travel</option><option value="Food">Food</option><option value="Rent">Rent</option><option value="Others">Others</option></select>
            </div>
          </div>
          <div id="expenseListContainer" class="flex-1 overflow-y-auto max-h-[560px] space-y-2.5 pr-1"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profileModal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-xl w-full max-w-sm"><h3 class="font-bold mb-4">Edit Profile</h3>
      <form onsubmit="handleProfileSubmit(event)" class="space-y-4">
        <input type="text" id="modalProfileName" class="w-full p-2 border rounded" placeholder="Name" />
        <input type="text" id="modalProfileId" class="w-full p-2 border rounded" placeholder="Emp ID" />
        <input type="email" id="modalProfileEmail" class="w-full p-2 border rounded" placeholder="Email" />
        <input type="text" id="modalProfilePassword" class="w-full p-2 border rounded" placeholder="Password" />
        <button type="submit" id="btnUpdateProfile" class="w-full bg-red-600 text-white p-2 rounded">Save</button>
        <button type="button" onclick="closeProfileModal()" class="w-full p-2 text-slate-500">Cancel</button>
      </form>
    </div>
  </div>

  <!-- TRIP MODAL -->
  <div id="tripModal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-xl w-full max-w-md"><h3 id="modalTripTitle" class="font-bold mb-4">Trip Details</h3>
      <form onsubmit="handleTripModalSubmit(event)" class="space-y-4">
        <input type="text" id="modalProjectName" required placeholder="Project Name" class="w-full p-2 border rounded" />
        <input type="date" id="modalStartDate" required class="w-full p-2 border rounded" />
        <input type="date" id="modalEndDate" required class="w-full p-2 border rounded" />
        <input type="number" id="modalAdvance" placeholder="Advance Amount" class="w-full p-2 border rounded" />
        <button type="submit" class="w-full bg-red-600 text-white p-2 rounded">Save Trip</button>
        <button type="button" onclick="closeTripModal()" class="w-full p-2 text-slate-500">Cancel</button>
      </form>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // PASTE YOUR LATEST GOOGLE APPS SCRIPT URL HERE
    // -------------------------------------------------------------
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxM3qydl2j8lmGgLescixv9YtJ9cuDlVhb_Z7WWOsGVKhALJJkoI8e8fycsTul17KLMwg/exec";

    let appState = { currentUser: "", employeeId: "", email: "", password: "", currentTripId: null, activeCategory: "Travel", trips: [], expenses: [] };
    let sessionTimeoutTracker; let authMode = "login"; 

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("fieldDate").value = new Date().toISOString().split("T")[0];
      checkSession();
    });

    function toggleAuthMode() {
      authMode = authMode === "login" ? "register" : "login";
      document.getElementById("nameFieldGroup").classList.toggle("hidden", authMode === "login");
      document.getElementById("emailFieldGroup").classList.toggle("hidden", authMode === "login");
      document.getElementById("authName").required = authMode === "register";
      document.getElementById("authEmail").required = authMode === "register";
      document.getElementById("authIdLabel").innerHTML = authMode === "login" ? 'Employee ID or Email <span class="text-red-500">*</span>' : 'Employee ID <span class="text-red-500">*</span>';
      document.getElementById("authTitle").innerText = authMode === "login" ? "Company Portal" : "Create Account";
      document.getElementById("authSubtitle").innerText = authMode === "login" ? "Sign in to manage your expenses" : "Register as a new employee";
      document.getElementById("authSubmitBtn").innerHTML = authMode === "login" ? 'Secure Login <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>' : 'Register Account <i class="fa-solid fa-user-plus ml-2"></i>';
      document.getElementById("authToggleBtn").innerText = authMode === "login" ? "New employee? Create an account" : "Already have an account? Sign In";
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("authSubmitBtn"); btn.disabled = true;
      const payload = { action: authMode, name: document.getElementById("authName").value.trim(), empId: document.getElementById("authId").value.trim(), email: document.getElementById("authEmail").value.trim(), password: document.getElementById("authPassword").value.trim() };
      if (authMode === "login") payload.loginId = document.getElementById("authId").value.trim();

      try {
        const response = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
        const result = await response.json();
        if (result.status === "success") {
          if (authMode === "register") { alert("Account created! Please log in."); toggleAuthMode(); } 
          else {
            appState.currentUser = result.user.name; appState.employeeId = result.user.empId; appState.email = result.user.email; appState.password = result.user.password;
            localStorage.setItem("expense_session_expiry", Date.now() + (60 * 60 * 1000)); saveStorageData(); showMainApp();
          }
        } else alert(result.message);
      } catch (err) { alert("Network Error: Make sure you deployed a NEW Web App URL and pasted it in the code."); }
      finally { btn.disabled = false; }
    }

    function checkSession() {
      const exp = localStorage.getItem("expense_session_expiry");
      if (exp && Date.now() < parseInt(exp)) { loadStorageData(); showMainApp(); resetSessionTimer(); } else logout(false);
    }
    function resetSessionTimer() { clearTimeout(sessionTimeoutTracker); localStorage.setItem("expense_session_expiry", Date.now() + (60 * 60 * 1000)); sessionTimeoutTracker = setTimeout(() => logout(false), 60 * 60 * 1000); }
    document.addEventListener("mousemove", () => { if(!document.getElementById("mainApp").classList.contains("hidden")) resetSessionTimer(); });

    function logout(manual = true) { localStorage.removeItem("expense_session_expiry"); document.getElementById("mainApp").classList.add("hidden"); document.getElementById("mainApp").classList.remove("flex"); document.getElementById("authScreen").classList.remove("hidden"); }

    function showMainApp() {
      document.getElementById("authScreen").classList.add("hidden"); document.getElementById("mainApp").classList.remove("hidden"); document.getElementById("mainApp").classList.add("flex");
      document.getElementById("navEmployeeName").innerText = appState.currentUser;
      if(appState.trips.length === 0) { appState.trips.push({ id: "trip_1", employeeName: appState.currentUser, projectName: "Default Trip", startDate: "2026-01-01", endDate: "2026-01-01", advance: 0 }); appState.currentTripId = "trip_1"; saveStorageData(); }
      renderTripDropdown(); recalcStatsAndRender();
    }

    function openProfileModal() { document.getElementById("modalProfileName").value = appState.currentUser; document.getElementById("modalProfileId").value = appState.employeeId; document.getElementById("modalProfileEmail").value = appState.email; document.getElementById("modalProfilePassword").value = appState.password; document.getElementById("profileModal").classList.remove("hidden"); }
    function closeProfileModal() { document.getElementById("profileModal").classList.add("hidden"); }

    async function handleProfileSubmit(e) {
      e.preventDefault();
      const payload = { action: "updateProfile", oldEmpId: appState.employeeId, name: document.getElementById("modalProfileName").value.trim(), empId: document.getElementById("modalProfileId").value.trim(), email: document.getElementById("modalProfileEmail").value.trim(), password: document.getElementById("modalProfilePassword").value.trim() };
      try {
        const response = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
        const result = await response.json();
        if (result.status === "success") { appState.currentUser = payload.name; appState.employeeId = payload.empId; appState.email = payload.email; appState.password = payload.password; document.getElementById("navEmployeeName").innerText = payload.name; saveStorageData(); closeProfileModal(); alert("Profile updated!"); }
      } catch (err) { alert("Network Error"); }
    }

    function loadStorageData() {
      appState.currentUser = localStorage.getItem("expense_current_user"); appState.employeeId = localStorage.getItem("expense_employee_id"); appState.email = localStorage.getItem("expense_email"); appState.password = localStorage.getItem("expense_password");
      try { appState.trips = JSON.parse(localStorage.getItem("expense_trips")) || []; } catch(e){}
      try { appState.expenses = JSON.parse(localStorage.getItem("expense_records")) || []; } catch(e){}
      appState.currentTripId = localStorage.getItem("expense_active_trip_id") || (appState.trips[0] ? appState.trips[0].id : null);
    }
    function saveStorageData() {
      localStorage.setItem("expense_current_user", appState.currentUser); localStorage.setItem("expense_employee_id", appState.employeeId); localStorage.setItem("expense_email", appState.email); localStorage.setItem("expense_password", appState.password); localStorage.setItem("expense_trips", JSON.stringify(appState.trips)); localStorage.setItem("expense_records", JSON.stringify(appState.expenses));
      if (appState.currentTripId) localStorage.setItem("expense_active_trip_id", appState.currentTripId);
    }

    function renderTripDropdown() {
      const sel = document.getElementById("tripSelect"); sel.innerHTML = "";
      appState.trips.forEach(t => { const opt = document.createElement("option"); opt.value = t.id; opt.textContent = t.projectName; if(t.id === appState.currentTripId) opt.selected=true; sel.appendChild(opt); });
      const trip = appState.trips.find(t=>t.id===appState.currentTripId);
      if(trip) document.getElementById("tripDurationDisplay").innerText = `${trip.startDate} to ${trip.endDate}`;
      const advInput = document.getElementById("statAdvanceInput"); if(advInput) advInput.value = trip ? (trip.advance || 0) : 0;
    }
    
    function updateTripAdvance(val) { const trip = appState.trips.find(t => t.id === appState.currentTripId); if (trip) { trip.advance = parseFloat(val) || 0; saveStorageData(); recalcStatsAndRender(); } }
    function onTripChange() { appState.currentTripId = document.getElementById("tripSelect").value; saveStorageData(); renderTripDropdown(); recalcStatsAndRender(); }
    function openTripModal(edit) {
      if(edit && appState.currentTripId) { const t = appState.trips.find(x=>x.id===appState.currentTripId); document.getElementById("modalProjectName").value = t.projectName; document.getElementById("modalStartDate").value = t.startDate; document.getElementById("modalEndDate").value = t.endDate; document.getElementById("modalAdvance").value = t.advance || 0; } 
      else { document.getElementById("modalProjectName").value = ""; document.getElementById("modalAdvance").value = ""; }
      document.getElementById("tripModal").classList.remove("hidden"); 
    }
    function closeTripModal() { document.getElementById("tripModal").classList.add("hidden"); }
    
    function handleTripModalSubmit(e) {
      e.preventDefault();
      const proj = document.getElementById("modalProjectName").value, sd = document.getElementById("modalStartDate").value, ed = document.getElementById("modalEndDate").value, adv = parseFloat(document.getElementById("modalAdvance").value) || 0;
      const existing = appState.trips.find(t => t.id === appState.currentTripId);
      if (existing && document.getElementById("modalProjectName").value !== "") { existing.projectName = proj; existing.startDate = sd; existing.endDate = ed; existing.advance = adv; } 
      else { const nt = { id: "trip_"+Date.now(), employeeName: appState.currentUser, projectName: proj, startDate: sd, endDate: ed, advance: adv }; appState.trips.push(nt); appState.currentTripId = nt.id; }
      saveStorageData(); closeTripModal(); renderTripDropdown(); recalcStatsAndRender();
    }

    // --- DELETION LOGIC (API + UI) ---
    async function deleteCurrentTrip() {
      if (!appState.currentTripId) return;
      const trip = appState.trips.find(t => t.id === appState.currentTripId);
      
      if (!confirm(`Are you sure you want to PERMANENTLY delete the entire trip "${trip.projectName}" and ALL its expenses?`)) return;

      const payload = { action: "deleteTrip", employeeName: appState.currentUser + " (" + appState.employeeId + ")", project: trip.projectName };

      // Optimistic UI Update
      appState.trips = appState.trips.filter(t => t.id !== appState.currentTripId);
      appState.expenses = appState.expenses.filter(e => e.tripId !== appState.currentTripId);
      appState.currentTripId = appState.trips.length > 0 ? appState.trips[0].id : null;
      saveStorageData(); renderTripDropdown(); recalcStatsAndRender();

      // Send to DB
      fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
        .catch(e => console.error("Failed to delete from DB", e));
    }

    async function deleteExpense(expId) {
      if (!confirm("Are you sure you want to permanently delete this single expense?")) return;
      
      const exp = appState.expenses.find(e => e.id === expId);
      if (!exp) return;

      const payload = { action: "deleteExpense", employeeName: exp.employeeName, project: exp.project, date: exp.date, amount: exp.amount };

      // Optimistic UI Update
      appState.expenses = appState.expenses.filter(e => e.id !== expId);
      saveStorageData(); recalcStatsAndRender();

      // Send to DB
      fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
        .catch(e => console.error("Failed to delete from DB", e));
    }
    
    function setExpenseType(t) { appState.activeCategory = t; ["Travel","Food","Rent","Others"].forEach(x => { document.getElementById(`fields${x}`).classList.toggle("hidden", x!==t); document.getElementById(`tab-${x}`).className = x===t ? "py-2 rounded-md transition text-center shadow-sm bg-white text-red-600 font-bold" : "py-2 rounded-md transition text-center text-slate-600 hover:text-slate-900"; }); }

    let currentCompressedBill = null, currentCompressedPay = null;
    async function previewImageFile(input, type) {
      if(input.files && input.files[0]) {
        const reader = new FileReader(); reader.readAsDataURL(input.files[0]);
        reader.onload = e => { const i = new Image(); i.src = e.target.result; i.onload = () => { const c = document.createElement("canvas"); c.width=600; c.height=(i.height*600)/i.width; c.getContext("2d").drawImage(i,0,0,c.width,c.height); const b64 = c.toDataURL("image/jpeg",0.7); if(type==='fileBill') currentCompressedBill = b64; else currentCompressedPay = b64; }; };
      }
    }

    function evaluateMathAmount(expr) {
      if (!expr) return 0; const clean = expr.toString().replace(/[^0-9+\-*/.]/g, "");
      try { const result = Function('"use strict";return (' + clean + ")")(); return isNaN(result) ? 0 : parseFloat(result); } catch (e) { return parseFloat(clean) || 0; }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSaveExpense"); btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving...';
      const t = appState.trips.find(x=>x.id===appState.currentTripId);
      const amtExpr = document.getElementById("fieldAmount").value.trim();
      const evaluatedAmt = evaluateMathAmount(amtExpr);
      
      let payload = {
        id: "exp_" + Date.now(),
        tripId: appState.currentTripId,
        action: "addExpense",
        employeeName: appState.currentUser + " (" + appState.employeeId + ")", project: t ? t.projectName : "Trip", category: appState.activeCategory,
        date: document.getElementById("fieldDate").value, amount: evaluatedAmt, amountExpr: amtExpr,
        paymentType: document.getElementById("fieldPaymentType").value, remarks: document.getElementById("fieldRemarkNotes").value.trim(),
        billImage: currentCompressedBill, payImage: currentCompressedPay
      };
      
      if (appState.activeCategory === "Travel") { payload.origin = document.getElementById("travelOrigin").value.trim(); payload.destination = document.getElementById("travelDestination").value.trim(); payload.transportMode = document.getElementById("travelTransportMode").value; payload.purpose = document.getElementById("travelPurpose").value.trim(); payload.reason = payload.purpose || "Travel"; } 
      else if (appState.activeCategory === "Food") { payload.reason = document.getElementById("foodReasonSelect").value || "Food"; } 
      else if (appState.activeCategory === "Rent") { payload.roomLocation = document.getElementById("rentLocation").value.trim(); payload.rentType = document.getElementById("rentDurationType").value; payload.roomType = document.getElementById("rentRoomType").value; payload.reason = payload.roomLocation + " (" + payload.roomType + " - " + payload.rentType + ")"; } 
      else { payload.reason = document.getElementById("othersReason").value.trim() || "Expense"; }
      
      try {
        const r = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
        const res = await r.json();
        if(res.status==="success") { appState.expenses.push(payload); saveStorageData(); recalcStatsAndRender(); document.getElementById("expenseForm").reset(); currentCompressedBill=null; currentCompressedPay=null;}
      } catch(err) { alert("Network Error: " + err.message); }
      finally { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Save to Database'; }
    }

    function recalcStatsAndRender() {
      const trip = appState.trips.find(t => t.id === appState.currentTripId);
      const tripExpenses = appState.expenses.filter(e => e.project === (trip ? trip.projectName : ""));

      const grandTotal = tripExpenses.reduce((sum, item) => sum + (item.amount || 0), 0);
      const advance = trip ? (trip.advance || 0) : 0;
      const net = advance - grandTotal;

      document.getElementById("statTotalItems").innerText = tripExpenses.length;
      document.getElementById("statTotalExpenses").innerText = `₹${grandTotal.toFixed(2)}`;
      
      const netEl = document.getElementById("statNetBalance"); const netBadge = document.getElementById("netBalanceBadge"); const netIconBg = document.getElementById("netBalanceIconBg");
      if (net > 0) { netEl.className = "text-2xl font-bold text-emerald-600 mt-1"; netEl.innerText = `₹${net.toFixed(2)}`; netBadge.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700"; netBadge.innerText = "Return to Company"; netIconBg.className = "w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl"; } 
      else if (net < 0) { netEl.className = "text-2xl font-bold text-red-600 mt-1"; netEl.innerText = `₹${Math.abs(net).toFixed(2)}`; netBadge.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-700"; netBadge.innerText = "Company Owes You"; netIconBg.className = "w-12 h-12 bg-red-50 text-red-600 rounded-xl flex items-center justify-center text-xl"; } 
      else { netEl.className = "text-2xl font-bold text-slate-700 mt-1"; netEl.innerText = `₹0.00`; netBadge.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700"; netBadge.innerText = "Settled"; netIconBg.className = "w-12 h-12 bg-slate-50 text-slate-600 rounded-xl flex items-center justify-center text-xl"; }

      renderExpenseTable();
    }

    function renderExpenseTable() {
      const c = document.getElementById("expenseListContainer"); c.innerHTML = "";
      const filter = document.getElementById("categoryFilter").value;
      const trip = appState.trips.find(t=>t.id===appState.currentTripId);
      
      let items = appState.expenses.filter(e=>e.project === (trip ? trip.projectName : ""));
      if(filter !== "All") items = items.filter(e=>e.category === filter);
      
      items.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(item => {
        const d = document.createElement("div"); d.className = "p-3 border border-slate-200 bg-slate-50 rounded-lg flex justify-between items-center";
        d.innerHTML = `
          <div>
            <div class="font-bold text-sm">${item.category} - ${item.reason}</div>
            <div class="text-[11px] text-slate-500">${item.date} | ${item.paymentType} ${item.remarks ? `(${item.remarks})` : ""}</div>
          </div>
          <div class="text-right flex flex-col items-end">
            <div class="font-bold text-slate-900">₹${item.amount}</div>
            <button onclick="deleteExpense('${item.id}')" class="text-slate-400 hover:text-red-600 text-xs mt-1 transition" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        `;
        c.appendChild(d);
      });
    }

    // JSZip & EXCEL logic unchanged
  </script>
</body>
</html>
